# =============================================================================
# Mosquitto · configuración de laboratorio
# ADVERTENCIA: allow_anonymous true solo debe usarse en una red controlada.
# Para producción use mosquitto.prod.conf.example y configure TLS + ACL.
# =============================================================================

listener 1883 0.0.0.0
allow_anonymous true

listener 9001 0.0.0.0
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Mensajes retenidos: se conserva el último valor por tópico.
retain_available true
max_keepalive 120
